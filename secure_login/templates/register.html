<!DOCTYPE html>
<html>
<head>

    <title>Secure Registration</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #aaa;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        a {
            text-decoration: none;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <form method="POST">

        <input
            type="text" name="name" placeholder="Name" required
        >

        <input
            type="email" name="email" placeholder="Email" required
        >

        <input
            type="password" name="password" placeholder="Password" required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
