<!DOCTYPE html>
<html>
<head>

    <title>Secure Login</title>

    <style>

        body {
            font-family: Arial;
            background: #2f1212;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Secure Login</h2>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New user?
        <a href="/register">Create Account</a>
    </p>

</div>

</body>
</html>
